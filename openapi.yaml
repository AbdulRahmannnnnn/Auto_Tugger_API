openapi: 3.0.3
info:
  title: Auto Tugger AMR/AGV Control API
  description: |
    API for controlling and monitoring a fleet of AMR/AGV vehicles (Auto Tugger) —
    dispatching tasks to vehicles, monitoring vehicle telemetry, and managing the
    task lifecycle (create / cancel / query).
    [See API Collection using Postman](https://github.com/AbdulRahmannnnnn/Auto_Tugger_API/blob/main/Auto%20Tugger%20API.postman_collection.json):
  version: "1.0.0"
servers:
  - url: http://localhost:62205
    description: Local RCS (Robot Control System) server

tags:
  - name: Order
    description: Task/order management for vehicles (create, cancel, query)
  - name: Movement
    description: Direct movement commands issued to a specific vehicle
  - name: Vehicle
    description: Status and telemetry information for vehicles (AMR/AGV)

paths:
  /api/Amr/MoveAmrToStation:
    post:
      operationId: moveAmrToStation
      tags: [Movement]
      summary: Move vehicle to station
      description: >
        Sends one vehicle (specified via DesignatedCarrier) to an active station
        (TargetStation), along with the list of operations to perform on arrival.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveStationParm'
            example:
              OrderID: "26010303"
              Priority: 0
              DesignatedCarrier: 1
              TargetStation: 253
              Operations:
                - OperationCode: 368
                  Parameter1: 2
                  Parameter2: 0
                  Parameter3: 0
                  ExecutionType: 1
              PermanentFlag: true
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResultResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: MoveAmrToStation
                resData: '{"ExecResult":true,"ExecCode":0,"ExecMsg":"26010303"}'
                ResTime: "2026-01-03 11:24:31"

  /api/Amr/MoveAmrToNode:
    post:
      operationId: moveAmrToNode
      tags: [Movement]
      summary: Move vehicle to node
      description: >
        Sends one vehicle (DesignatedCarrier) to a navigation node (TargetNode),
        along with the list of operations to perform on arrival.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveNodeParm'
            example:
              OrderID: "26010304"
              Priority: 0
              DesignatedCarrier: 1
              TargetNode: 631
              Operations:
                - OperationCode: 0
                  Parameter1: 0
                  Parameter2: 0
                  Parameter3: 0
                  ExecutionType: 0
              PermanentFlag: false
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResultResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: MoveAmrToNode
                resData: '{"ExecResult":true,"ExecCode":0,"ExecMsg":"26010304"}'
                ResTime: "2026-01-03 11:24:31"

  /api/Amr/ReleaseAmr:
    get:
      operationId: releaseAmr
      tags: [Movement]
      summary: Release vehicle
      description: >
        Releases a vehicle from its allocated/locked state so it becomes available
        for the next task. Useful when a vehicle is stuck on an order that is no
        longer relevant.
      parameters:
        - name: carrierID
          in: query
          required: true
          description: Number of the vehicle (carrier) to release
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 65535
          example: 
            "1"
            
      x-codeSamples:
        - lang: cURL
          label: Payload
          source: |
            "1"
  
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResultResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: ReleaseAmr
                resData: '{"ExecResult":true,"ExecCode":0,"ExecMsg":"26010304"}'
                ResTime: "2026-01-03 11:24:31"

  /api/Amr/GetOrderMsg:
    get:
      operationId: getOrderMsg
      tags: [Order]
      summary: Order details
      description: >
        Returns the details of a single order: the vehicle handling it, the target
        node/station, priority, current status, creation time, and its operations.
      parameters:
        - name: orderID
          in: query
          required: true
          description: ID of the order to query
          schema:
            type: string
          example: "26010305"
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET "http://localhost:62205/api/Amr/GetOrderMsg?orderID=26010305"
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderMsgResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: GetOrderMsg
                resData: >-
                  {"CarrierID":1,"OrderID":"26010305","Node":631,"Station":0,
                  "Priority":0,"Status":2,
                  "CreateTime":"2026-01-03T14:04:08.1346693+08:00","OpCount":1,
                  "Operations":[{"OperationCode":0,"Parameter1":0,"Parameter2":0,
                  "Parameter3":0,"ExecutionType":0}]}
                ResTime: "2026-01-03 14:04:59"

  /api/Amr/GetExecutingOrders:
    get:
      operationId: getExecutingOrders
      tags: [Order]
      summary: Executing orders
      description: >
        Returns every order currently being executed, together with the vehicle,
        destination, and status of each. Takes no parameters.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET "http://localhost:62205/api/Amr/GetExecutingOrders"
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExecutingOrdersResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: GetExecutingOrders
                resData: >-
                  {"OrderMsgList":[{"CarrierID":1,"OrderID":"26010306","Node":2223,
                  "Station":0,"Priority":0,"Status":2,
                  "CreateTime":"2026-01-03T14:11:44.5616503+08:00","OpCount":1,
                  "Operations":[{"OperationCode":0,"Parameter1":0,"Parameter2":0,
                  "Parameter3":0,"ExecutionType":0}]},
