                ResTime: "2026-01-03 14:12:46"

  /api/Amr/AddOrder:
    post:
      operationId: addOrder
      tags: [Order]
      summary: Add order
      description: >
        Creates a new order for a specific vehicle (via CarrierID) or for a vehicle
        type (via CarrierType), targeting a node or station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderParm'
            example:
              OrderID: "26010307"
              CarrierID: 1
              CarrierType: 0
              TargetNode: 631
              TargetStation: 0
              Priority: 1
              Operations:
                - OperationCode: 0
                  Parameter1: 0
                  Parameter2: 0
                  Parameter3: 0
                  ExecutionType: 0
              ReplyUrl: ""
              PermanentFlag: true
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResultResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: AddOrder
                resData: '{"ExecResult":true,"ExecCode":0,"ExecMsg":"success"}'
                ResTime: "2026-01-03 15:01:33"

  /api/Amr/CancelOrder:
    post:
      operationId: cancelOrder
      tags: [Order]
      summary: Cancel order
      description: >
        Cancels an order by its OrderID. Through `releaseFlag`, the vehicle working
        on that order can be released in the same operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInfo'
            example:
              orderID: "26010308"
              releaseFlag: true
      responses:
        '200':
          description: Request completed — check `resCode` in the body for the real status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResultResponse'
              example:
                resCode: 0
                resMsg: success
                BizCode: CancelOrder
                resData: '{"ExecResult":true,"ExecCode":0,"ExecMsg":"success"}'
                ResTime: "2026-01-03 15:01:33"

