components:
  schemas:

    # ---------------------------------------------------------------------
    # Common response envelope (Result wrapper)
    # ---------------------------------------------------------------------

    ResultBase:
      type: object
      description: >
        Common envelope shared by every response. The `resData` field is overridden
        per endpoint by the derived schemas below (see the *...Response* schemas),
        because its content type differs per endpoint and it is actually sent as a
        stringified JSON payload (see the notes in `info.description`).
      required:
        - resCode
        - resMsg
        - BizCode
        - ResTime
      properties:
        resCode:
          type: integer
          format: int32
          description: >
            Result code. Values are unique: 0 = success, anything else = failure.
          example: 0
        resMsg:
          type: string
          description: Message describing the outcome of the call.
          example: success
        BizCode:
          type: string
          description: Business code — the name of the endpoint that was called (e.g. "AddOrder").
          example: AddOrder
        ResTime:
          type: string
          description: >
            Time the server produced the response, formatted "yyyy-MM-dd HH:mm:ss".
            Note: the actual field name in the JSON response is "ResTime" (capital R),
            which differs from the "resTime" written in the original documentation tables.
          example: "2026-01-03 11:24:31"

    ResDataModel:
      type: object
      description: >
        Generic execution result, used by the action endpoints (MoveAmrToStation,
        MoveAmrToNode, ReleaseAmr, AddOrder, CancelOrder). This is the shape AFTER
        the client re-parses the `resData` string with JSON.parse().
      properties:
        ExecResult:
          type: boolean
          description: Execution result (true = success, false = failure).
        ExecCode:
          type: integer
          format: int32
          description: Execution result code.
        ExecMsg:
          type: string
          description: Execution result message (often the related OrderID, or "success").

    OperationResultResponse:
      description: >
        Response envelope for endpoints that return a ResDataModel in `resData`
        (MoveAmrToStation, MoveAmrToNode, ReleaseAmr, AddOrder, CancelOrder).
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            resData:
              type: string
              description: >
                Stringified JSON containing a ResDataModel. The client must run
                JSON.parse() again to obtain the
                { ExecResult, ExecCode, ExecMsg } object.
              x-decoded-schema: '#/components/schemas/ResDataModel'
              example: '{"ExecResult":true,"ExecCode":0,"ExecMsg":"26010303"}'

    GetOrderMsgResponse:
      description: Response envelope for GetOrderMsg (resData = OrderMsg).
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            resData:
              type: string
              description: >
                Stringified JSON containing an OrderMsg. The client must run
                JSON.parse() again to obtain the actual object.
              x-decoded-schema: '#/components/schemas/OrderMsg'
              example: >-
                {"CarrierID":1,"OrderID":"26010305","Node":631,"Station":0,
                "Priority":0,"Status":2,
                "CreateTime":"2026-01-03T14:04:08.1346693+08:00","OpCount":1,
                "Operations":[{"OperationCode":0,"Parameter1":0,"Parameter2":0,
                "Parameter3":0,"ExecutionType":0}]}

    GetExecutingOrdersResponse:
      description: Response envelope for GetExecutingOrders (resData = OrderMsgMPL).
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            resData:
              type: string
              description: >
                Stringified JSON containing an OrderMsgMPL (a list of OrderMsg).
                The client must run JSON.parse() again to obtain the actual object.
              x-decoded-schema: '#/components/schemas/OrderMsgMPL'

    GetAmrMsgResponse:
      description: Response envelope for GetAmrMsg (resData = AmrMsgParam).
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            resData:
              type: string
              description: >
                Stringified JSON containing an AmrMsgParam (full telemetry for one
                vehicle). The client must run JSON.parse() again to obtain the
                actual object.
              x-decoded-schema: '#/components/schemas/AmrMsgParam'

    GetAmrMsgMPLResponse:
      description: Response envelope for GetAmrMsgMPL (resData = AmrMsgParamAll).
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            resData:
              type: string
              description: >
                Stringified JSON containing an AmrMsgParamAll (a list of AmrMsgParam
                for all vehicles). The client must run JSON.parse() again to obtain
                the actual object.
              x-decoded-schema: '#/components/schemas/AmrMsgParamAll'

    # ---------------------------------------------------------------------
    # Request structures
    # ---------------------------------------------------------------------

    OperationMsg:
      type: object
      description: A single operation/action the vehicle performs at its destination.
      properties:
        OperationCode:
          type: integer
          format: int32
          description: |
            Code of the operation/action to perform.

            Supported values:
            - `368` — Towing up and down
            - `16` — Charging
        Parameter1:
          type: integer
          format: int32
          description: |
            Additional parameter 1 for this operation.

            Supported values:
            - `1` — Towing down (catch the cart), or Charge
            - `2` — Towing up (release the cart)
        Parameter2:
          type: integer
          format: int32
          description: Additional parameter 2 for this operation. Always '0'
        Parameter3:
          type: integer
          format: int32
          description: Additional parameter 3 for this operation. Always '0'
        ExecutionType:
          type: integer
          format: int32
          description: >
            How the operation is executed. Typically 0 or 1 depending on the
            endpoint (see the description of the calling endpoint).

    MoveStationParm:
      type: object
      description: Parameters for sending a specific vehicle to a specific active station.
      required:
        - OrderID
        - DesignatedCarrier
        - TargetStation
      properties:
        OrderID:
          type: string
          description: Order number/ID.
        Priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: >
            Order priority. The higher the value, the higher the priority. The
            original documentation table states a range of 1-5, but the official
            request examples for MoveAmrToStation and MoveAmrToNode use 0 —
            apparently meaning "default / not set". The lower bound in this spec is
            relaxed to 0 so the official examples still pass validation.
        DesignatedCarrier:
          type: integer
          format: int32
          description: Number of the vehicle assigned to carry out this task.
        TargetStation:
          type: integer
          format: int32
          description: Target active station.
        Operations:
          type: array
          description: Operations to perform once the vehicle reaches its destination.
          items:
            $ref: '#/components/schemas/OperationMsg'
        PermanentFlag:
          type: boolean
          description: Whether this task is permanent/resident (recurring).

    MoveNodeParm:
      type: object
      description: Parameters for sending a specific vehicle to a specific navigation node.
      required:
        - OrderID
        - DesignatedCarrier
        - TargetNode
      properties:
        OrderID:
          type: string
          description: Order number/ID.
        Priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: >
            Order priority. The higher the value, the higher the priority. The
            original documentation table states a range of 1-5, but the official
            request examples for MoveAmrToStation and MoveAmrToNode use 0 —
            apparently meaning "default / not set". The lower bound in this spec is
            relaxed to 0 so the official examples still pass validation.
        DesignatedCarrier:
          type: integer
          format: int32
          description: Number of the vehicle assigned to carry out this task.
        TargetNode:
          type: integer
          format: int32
          description: Target navigation node.
        Operations:
          type: array
          description: Operations to perform once the vehicle reaches its destination.
          items:
            $ref: '#/components/schemas/OperationMsg'
        PermanentFlag:
          type: boolean
          description: Whether this task is permanent/resident (recurring).

    OrderParm:
      type: object
      description: Parameters for creating a new order/task.
      required:
        - OrderID
        - TargetNode
        - TargetStation
      properties:
        OrderID:
          type: string
          description: Order number/ID.
        CarrierID:
          type: integer
          format: int32
          description: >
            Number of the specific vehicle to assign. Must not be 0 when
            CarrierType is also 0.
        CarrierType:
          type: integer
          format: int32
          description: >
            Type of vehicle to assign (used when not targeting a specific vehicle).
            Must not be 0 when CarrierID is also 0.
        TargetNode:
          type: integer
          format: int32
          description: Target navigation node.
        TargetStation:
          type: integer
          format: int32
          description: Target active station.
        Priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: >
            Order priority. The higher the value, the higher the priority. The
            original documentation table states a range of 1-5, but the official
            request examples for MoveAmrToStation and MoveAmrToNode use 0 —
            apparently meaning "default / not set". The lower bound in this spec is
            relaxed to 0 so the official examples still pass validation.
        Operations:
          type: array
          description: Operations to perform once the vehicle reaches its destination.
          items:
            $ref: '#/components/schemas/OperationMsg'
        ReplyUrl:
          type: string
          description: >
            Callback URL used to report back the ID of the vehicle allocated to this
            order. Optional — send an empty string ("") when not used.
        PermanentFlag:
          type: boolean
          description: Whether this task is permanent/resident (recurring).

    CancelInfo:
      type: object
      description: Parameters for cancelling an order/task.
      required:
        - orderID
        - releaseFlag
      properties:
        orderID:
          type: string
          description: ID of the order to cancel.
        releaseFlag:
          type: boolean
          description: >
            Whether the associated vehicle should also be released immediately
            along with the cancellation.

    # ---------------------------------------------------------------------
    # Order structures (for GetOrderMsg and GetExecutingOrders)
    # ---------------------------------------------------------------------

    OrderMsg:
      type: object
      description: Full information about a single order/task.
      properties:
        CarrierID:
          type: integer
          format: int32
          description: Number of the vehicle carrying out this order.
        OrderID:
          type: string
          description: Order number/ID.
        Node:
          type: integer
          format: int32
          description: Target navigation node (when the order targets a node).
        Station:
          type: integer
          format: int32
          description: Target active station (when the order targets a station).
        Priority:
          type: integer
          format: int32
          description: Order priority.
        Status:
          type: integer
          format: int32
          description: >
            Task status: 0 = idle, 1 = start, 2 = delivering, 3 = operating,
            4 = finished, 5 = cancelled, 255 = abnormal, any other value = unknown error.
          enum: [0, 1, 2, 3, 4, 5, 255]
        CreateTime:
          type: string
          format: date-time
          description: Time the order was created.
        OpCount:
          type: integer
          format: int32
          description: Number of operations in this order.
        Operations:
          type: array
          description: List of operations to perform.
          items:
            $ref: '#/components/schemas/OperationMsg'

    OrderMsgMPL:
      type: object
      description: Wrapper around a list of orders — returned by GetExecutingOrders.
      properties:
        OrderMsgList:
          type: array
          description: All orders currently being executed.
          items:
            $ref: '#/components/schemas/OrderMsg'

    # ---------------------------------------------------------------------
    # Vehicle telemetry structures (for GetAmrMsg and GetAmrMsgMPL)
    # ---------------------------------------------------------------------

    AmrMsgParam:
      type: object
      description: Complete telemetry for a single vehicle (AMR/AGV).
      properties:
        carrierId:
          type: integer
          format: int32
          description: Vehicle number.
        amrCurrentAlarms:
          $ref: '#/components/schemas/AmrAlarmMsgMPL'
        amrBatteryMsg:
          $ref: '#/components/schemas/AmrBatteryMsg'
        amrConnectMsg:
          $ref: '#/components/schemas/AmrConnectMsg'
        amrCoordinateMsg:
          $ref: '#/components/schemas/AmrCoordinateMsg'
        amrLocationMsg:
          $ref: '#/components/schemas/AmrLocationMsg'
        amrMapMsg:
          $ref: '#/components/schemas/AmrMapMsg'
        amrSpeedMsg:
          $ref: '#/components/schemas/AmrSpeedMsg'
        amrStatusMsg:
          $ref: '#/components/schemas/AmrStatusMsg'
        amrOrderMsg:
          $ref: '#/components/schemas/AmrOrderMsg'
        amrTrafficMsg:
          $ref: '#/components/schemas/AmrTrafficMsg'
        amrPlanMsg:
          $ref: '#/components/schemas/AmrPlanMsg'
        amrMotorMsg:
          $ref: '#/components/schemas/AmrMotorMsg'
        amrScanMsg:
          $ref: '#/components/schemas/AmrScanMsg'

    AmrMsgParamAll:
      type: object
      description: Wrapper around telemetry for all vehicles — returned by GetAmrMsgMPL.
      properties:
        amrMsgList:
          type: array
          description: Telemetry for every vehicle.
          items:
            $ref: '#/components/schemas/AmrMsgParam'

    AmrAlarmMsgMPL:
      type: object
      description: Alarms currently active on the vehicle.
      properties:
        AmrAlarmMsgList:
          type: array
          items:
            $ref: '#/components/schemas/AmrAlarmMsg'

    AmrAlarmMsg:
      type: object
      description: A single vehicle alarm entry.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        AlarmCode:
          type: integer
          format: int32
          description: Alarm code.
        AlarmTime:
          type: string
          format: date-time
          description: Time the alarm was raised.
        AlarmDuration:
          type: integer
          format: int32
          description: How long the alarm has been active.
        ClearTime:
          type: string
          format: date-time
          description: Time the alarm was cleared.

    AmrBatteryMsg:
      type: object
      description: Vehicle battery information.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        RecordTime:
          type: string
          description: Time the data was recorded (sent as a plain string, not a standard date-time).
        Alarm:
          type: integer
          format: int32
          description: Battery-related alarm code.
        BatteryLevel:
          type: number
          format: double
          description: Battery charge level/percentage.
        ChargeCurrent:
          type: integer
          format: int32
          description: Current drawn while charging.
        ChargesCount:
          type: integer
          format: int32
          description: Number of charge cycles completed.
        DischargeCurrent:
          type: integer
          format: int32
          description: Current drawn while discharging.
        Temperature:
          type: integer
          format: int32
          description: Battery temperature.
        Voltage:
          type: integer
          format: int32
          description: Battery voltage.

    AmrConnectMsg:
      type: object
      description: Vehicle connection and allocation status.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        CarrierStatus:
          type: integer
          format: int32
          description: >
            Vehicle status: 0 = idle, 1 = locked, 2 = assigned, 3 = delivering,
            4 = arrived at station, 5 = changing.
          enum: [0, 1, 2, 3, 4, 5]
        ConnectType:
          type: integer
          format: int32
          description: "Connection type: 0 = normal, 1 = lock, 2 = recover."
          enum: [0, 1, 2]
        ConnectState:
          type: integer
          format: int32
          description: >
            Connection state: 0 = not started, 1 = online, 2 = offline, 3 = frozen.
          enum: [0, 1, 2, 3]
        CarrierToken:
          type: integer
          format: int32
          description: Vehicle token.
        CarrierPassType:
          type: integer
          format: int32
          description: Vehicle pass/permission type (value range 0-15).
        DisconnectTime:
          type: string
          description: Time the vehicle was frozen (sent as a plain string).
        OfflineTime:
          type: string
          description: Time the vehicle went offline (sent as a plain string).
        OnlineTime:
          type: string
          description: Time the vehicle came online (sent as a plain string).

    AmrCoordinateMsg:
      type: object
      description: Vehicle position coordinates.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        Angle:
          type: integer
          format: int32
          description: Vehicle heading angle.
        CoordinateX:
          type: number
          format: double
          description: X coordinate.
        CoordinateY:
          type: number
          format: double
          description: Y coordinate.
        CoordinateZ:
          type: number
          format: double
          description: Z coordinate.
        RecordTime:
          type: string
          format: date-time
          description: Time the data was recorded.

    AmrLocationMsg:
      type: object
      description: Vehicle logical location (current node and path).
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        Node:
          type: integer
          format: int32
          description: Current navigation node.
        Path:
          type: integer
          format: int32
          description: Current path segment.
        RecordTime:
          type: string
          format: date-time
          description: Time the data was recorded.

    AmrMapMsg:
      type: object
      description: >
        Vehicle map information. Note: these fields consistently use lower camel
        case (carrierId, mapData, recordTime), unlike most other Amr* structures
        which use "CarrierId" with a capital C.
      properties:
        carrierId:
          type: integer
          format: int32
          description: Vehicle number.
        mapData:
          type: string
          description: Map data (raw/encoded).
        recordTime:
          type: string
          description: Time the data was recorded (sent as a plain string).

    AmrSpeedMsg:
      type: object
      description: Vehicle speed and acceleration.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        Vx:
          type: integer
          format: int32
          description: Speed along the X axis (mm/s).
        Vy:
          type: integer
          format: int32
          description: Speed along the Y axis (mm/s).
        Vz:
          type: integer
          format: int32
          description: Speed along the Z axis (mm/s).
        Vw:
          type: integer
          format: int32
          description: Rotational/W speed (mm/s).
        LineAcc:
          type: number
          format: double
          description: Linear acceleration (mm/s^2).
        LineDec:
          type: number
          format: double
          description: Linear deceleration (mm/s^2).
        RotationAcc:
          type: number
          format: double
          description: Rotational acceleration (mm/s^2).
        RotationDec:
          type: number
          format: double
          description: Rotational deceleration (mm/s^2).
        RecordTime:
          type: string
          format: date-time
          description: Time the data was recorded.

    SensorValue:
      type: object
      description: A single obstacle-detection sensor reading.
      properties:
        SensorArea:
          type: integer
          format: int32
          description: Obstacle sensor area/zone.
        OutSignal:
          type: boolean
          description: Signal detected in the outer layer.
        MidSignal:
          type: boolean
          description: Signal detected in the middle layer.
        InSignal:
          type: boolean
          description: Signal detected in the inner layer.

    AmrStatusMsg:
      type: object
      description: Vehicle operational and mechanism status.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        CarrierType:
          type: integer
          format: int32
          description: Vehicle type.
        ControlMode:
          type: integer
          format: int32
          description: "Control mode: 1 = automatic, 0 = manual."
          enum: [0, 1]
        MotionType:
          type: integer
          format: int32
          description: >
            Motion type, a bit flag whose meaning depends on MotionState.
            When MotionState = stopped: bit0 = idle, bit1 = under traffic control,
            bit2 = abnormal, bit3 = charging, bit4 = paused, bit5 = operating.
            When MotionState = driving: bit0 = running normally,
            bit1 = running decelerated.
        MotionState:
          type: integer
          format: int32
          description: "Motion state: 0 = stopped, 1 = driving."
          enum: [0, 1]
        NavigationalState:
          type: integer
          format: int32
          description: Vehicle navigation state.
        Signal1:
          type: integer
          format: int32
          description: Photoelectric/optical signal 1.
        Signal2:
          type: integer
          format: int32
          description: Photoelectric/optical signal 2.
        Signal3:
          type: integer
          format: int32
          description: Photoelectric/optical signal 3.
        Signal4:
          type: integer
          format: int32
          description: Photoelectric/optical signal 4.
        Signal5:
          type: integer
          format: int32
          description: Photoelectric/optical signal 5.
        Signal6:
          type: integer
          format: int32
          description: Photoelectric/optical signal 6.
        Signal7:
          type: integer
          format: int32
          description: Photoelectric/optical signal 7.
        Signal8:
          type: integer
          format: int32
          description: Photoelectric/optical signal 8.
        MechanismState:
          type: integer
          format: int32
          description: State of the vehicle mechanism (e.g. lift/fork/roller).
        MechanismHeight:
          type: integer
          format: int32
          description: Mechanism height (primary).
        MechanismHeight2:
          type: integer
          format: int32
          description: Mechanism height (secondary, where two height axes exist).
        MechanismAngle:
          type: integer
          format: int32
          description: Mechanism angle.
        ShelfNumber:
          type: integer
          format: int32
          description: Number of the shelf/carrier currently being transported.
        GoodsWeight:
          type: integer
          format: int32
          description: Weight of the goods currently being carried.
        SensorsCount:
          type: integer
          format: int32
          description: Number of obstacle sensors actively reporting data.
        SensorValues:
          type: array
          description: Obstacle sensor readings.
          items:
            $ref: '#/components/schemas/SensorValue'
        RecordTime:
          type: string
          format: date-time
          description: Time the data was recorded.

    OrderInformation:
      type: object
      description: Information about one task in the vehicle's task list (AmrOrderMsg).
      properties:
        OrderID:
          type: string
          description: Order number/ID.
        OrderType:
          type: integer
          format: int32
          description: Task/order type.
        VertexNumber:
          type: integer
          format: int32
          description: Target point/vertex of the task.
        OpCount:
          type: integer
          format: int32
          description: Number of actions/operations in this task.
        Operations:
          type: array
          description: List of actions/operations.
          items:
            $ref: '#/components/schemas/OperationMsg'
        OrderStatus:
          type: integer
          format: int32
          description: Current status of the task.
        OperateProgress:
          type: integer
          format: int32
          description: Progress of the operation currently running.
        OrderError:
          type: integer
          format: int32
          description: >
            Task error code: 0 = no error, 1 = unknown task point,
            2 = unknown operation code, 3 = abnormal vehicle state,
            4 = cancel failed, 5 = change failed, any other value = unknown error.
          enum: [0, 1, 2, 3, 4, 5]
        OrderToken:
          type: string
          description: Internal token/number of the order dispatched to the vehicle.

    AmrOrderMsg:
      type: object
      description: Summary of the tasks currently running or recorded on the vehicle.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        RecordTime:
          type: string
          format: date-time
          description: Time the data was recorded.
        OrderCount:
          type: integer
          format: int32
          description: Number of tasks on this vehicle.
        OrderData:
          type: array
          description: Details of each task.
          items:
            $ref: '#/components/schemas/OrderInformation'

    AmrTrafficMsg:
      type: object
      description: Vehicle traffic-control status.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        BlockState:
          type: integer
          format: int32
          description: >
            Control state: 0 = none, bit0 = safety control, bit1 = walking control.
        BlockSource:
          type: integer
          format: int32
          description: Source of the control — the number of the vehicle causing it.
        BlockType:
          type: integer
          format: int32
          description: >
            Control type: 0 = none, 1 = path, 2 = area, 3 = variable.
          enum: [0, 1, 2, 3]
        BlockParam:
          type: integer
          format: int32
          description: >
            Control target — path number, area number, or variable value,
            depending on BlockType.

    AmrPlanMsg:
      type: object
      description: Current path-planning information for the vehicle.
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        RecordTime:
          type: string
          format: date-time
          description: Time the data was recorded.
        PlanState:
          type: integer
          format: int32
          description: >
            Planning state: 0 = idle, 1 = start, 2 = planning, 3 = paused,
            4 = stopped, 5 = ended, 200 = error, any other value = unknown error.
          enum: [0, 1, 2, 3, 4, 5, 200]
        PlanTargetNode:
          type: integer
          format: int32
          description: Final destination node of the planned route.
        PlanStartNode:
          type: integer
          format: int32
          description: Starting node of the planned route.
        PlanCurrentNode:
          type: integer
          format: int32
          description: The vehicle's current node within the planned route.
        DynamicPaths:
          type: array
          description: All available dynamic path candidates.
          items:
            type: integer
            format: int32
        RequestedPaths:
          type: array
          description: Paths currently being requested.
          items:
            type: integer
            format: int32
        LockedPaths:
          type: array
          description: Paths already locked for this vehicle.
          items:
            type: integer
            format: int32
        RunningPaths:
          type: array
          description: Paths the vehicle is currently travelling on.
          items:
            type: integer
            format: int32

    AmrMotorMsg:
      type: object
      description: >
        Vehicle motor and odometer information. Note: in the actual implementation
        the motor current fields for motors 4-8 are named "MotorCurren4" through
        "MotorCurren8" (missing the letter "t" — a typo in the original API), not
        "MotorCurrent4" etc. as written in the documentation tables. Motors 1-3
        keep the full spelling "MotorCurrent1/2/3".
      properties:
        CarrierId:
          type: integer
          format: int32
          description: Vehicle number.
        TotalMileage:
          type: integer
          format: int64
          description: Total distance travelled (in units of 0.1 metre).
        MotorCurrent1:
          type: integer
          format: int32
          description: Current of motor 1.
        MotorCurrent2:
          type: integer
          format: int32
          description: Current of motor 2.
        MotorCurrent3:
          type: integer
          format: int32
          description: Current of motor 3.
        MotorCurren4:
          type: integer
          format: int32
          description: Current of motor 4 (field name follows the typo in the original API — missing "t").
        MotorCurren5:
          type: integer
          format: int32
          description: Current of motor 5 (field name follows the typo in the original API — missing "t").
        MotorCurren6:
          type: integer
          format: int32
          description: Current of motor 6 (field name follows the typo in the original API — missing "t").
        MotorCurren7:
          type: integer
          format: int32
          description: Current of motor 7 (field name follows the typo in the original API — missing "t").
        MotorCurren8:
          type: integer
          format: int32
          description: Current of motor 8 (field name follows the typo in the original API — missing "t").
        MotorSpeed1:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 1.
        MotorSpeed2:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 2.
        MotorSpeed3:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 3.
        MotorSpeed4:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 4.
        MotorSpeed5:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 5.
        MotorSpeed6:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 6.
        MotorSpeed7:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 7.
        MotorSpeed8:
          type: integer
          format: int32
          description: Rotational speed (RPM) of motor 8.
        MotorAlarm1:
          type: integer
          format: int32
          description: Alarm code of motor 1.
        MotorAlarm2:
          type: integer
          format: int32
          description: Alarm code of motor 2.
        MotorAlarm3:
          type: integer
          format: int32
          description: Alarm code of motor 3.
        MotorAlarm4:
          type: integer
          format: int32
          description: Alarm code of motor 4.
        MotorAlarm5:
          type: integer
          format: int32
          description: Alarm code of motor 5.
        MotorAlarm6:
          type: integer
          format: int32
          description: Alarm code of motor 6.
        MotorAlarm7:
          type: integer
          format: int32
          description: Alarm code of motor 7.
        MotorAlarm8:
          type: integer
          format: int32
          description: Alarm code of motor 8.

    AmrScanMsg:
      type: object
      description: >
        Code-scanning results from the vehicle. Note: the data content field is
        written as "DataConent" (a typo) in the documentation table, but the actual
        JSON response examples name it "DataContent" (correct spelling) — this
        schema follows the field name from the actual response.
      properties:
        CarrierId:
          type: integer
